name: Activate robust CoolClass bot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace app.py with robust implementation
        shell: python
        run: |
          from pathlib import Path
          src = Path('fix_bot.py').read_text(encoding='utf-8')
          Path('app.py').write_text(src, encoding='utf-8')
      - name: Commit activated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Activate robust Telegram bot' || exit 0
          git push
