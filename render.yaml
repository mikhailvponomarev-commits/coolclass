services:
  - type: web
    name: coolclass-testbot
    runtime: python
    plan: free
    branch: feature/math-quiz-new-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python startup.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        value: Mikhail7890
      - key: ADMIN_CHAT_ID
        sync: false
      - key: PUBLIC_URL
        value: https://coolclass-testbot.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DB_PATH
        value: coolclass_quiz.db
